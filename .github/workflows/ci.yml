name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ts:
    name: TypeScript (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The download page builds its installer URL from the app version, so a version that
      # drifts out of step is a 404 on the page a buyer lands on. Cheapest possible check.
      - run: node scripts/check-version.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    # platform/mod.rs refuses to compile anywhere but macOS and Windows (PRD §3.3), so
    # there is no cheap Linux leg — the Rust suite runs on the OSes we actually ship.
    name: Rust (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            experimental: false
          # Required now that macOS ships: a red Mac build blocks the merge, exactly as a
          # red Windows one does.
          - os: macos-latest
            target: aarch64-apple-darwin
            experimental: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tauri_build::build() in build.rs fails unless frontendDist (apps/desktop/dist) exists.
      - run: pnpm -F desktop build

      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo check --target ${{ matrix.target }}
        working-directory: apps/desktop/src-tauri
