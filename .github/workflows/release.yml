name: Release

# Windows and macOS. Each platform builds in its own job; one publish job then writes the
# single latest.json that covers both, uploads everything to R2 and drafts the release.
on:
  push:
    tags: ["v*"]
  # So the whole thing can be rehearsed without creating a tag. A dispatch run uploads
  # nothing — it only proves the builds and the manifest work.
  workflow_dispatch:

permissions:
  contents: write # creating the release and uploading the installers

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never kill a half-uploaded release

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: release-x86_64-pc-windows-msvc

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Before anything is built: the download page builds its URL from tauri.conf.json, so a
      # tag that disagrees with it would publish an installer nobody can reach.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-version.mjs "${{ github.ref_name }}"

      - name: Check every copy of the version agrees
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: node scripts/check-version.mjs

      # The gate. A release build is slow, and shipping a binary whose tests were never run is
      # how a broken installer reaches the one page that has to work.
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

      # `--bundles nsis` rather than tauri.conf.json's "all": the MSI is not what the download
      # page offers, and the Store build is packaged separately as MSIX (ARCHITECTURE §9).
      #
      # The signing key is what makes self-updates safe: every install verifies the download
      # against the public half compiled into it, so an unsigned or tampered payload is
      # refused. Without these the build emits no .sig, and the manifest step fails.
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm -F desktop tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: hopshot-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Both architectures, because the build is one universal binary: a single download
      # that runs on Apple Silicon and Intel Macs alike, so the page never has to ask.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: release-universal-apple-darwin

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-version.mjs "${{ github.ref_name }}"

      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

      # A tagged release must be signed and notarised. Without notarisation macOS refuses to
      # open the app from a double-click, and without a stable signature the Screen Recording
      # permission does not survive an update — every capture after it would be wallpaper
      # only. Better a red build than shipping that. A dispatch rehearsal may run unsigned.
      - name: Check the Apple signing secrets are set
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              missing=1
            fi
          done
          exit $missing

      # Tauri reads the APPLE_* variables itself: it imports the certificate into a temporary
      # keychain, signs with the hardened runtime, notarises with Apple and staples the ticket.
      #
      # `app,dmg`: the .dmg is what the download page offers; the .app is what the updater
      # needs, packed by Tauri into Hopshot.app.tar.gz with its .sig.
      - name: Build, sign and notarise the app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # An unset secret arrives as an empty string, which Tauri treats as "set" and then
          # fails to decode. Unsetting the empty ones lets a rehearsal build unsigned.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          pnpm -F desktop tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Collect the artifacts
        shell: bash
        working-directory: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/macos"
          cp dmg/*.dmg macos/*.app.tar.gz macos/*.app.tar.gz.sig "$RUNNER_TEMP/macos/"
          ls -l "$RUNNER_TEMP/macos"

      # Tauri notarises and staples the .app, but not the .dmg that wraps it — and the .dmg is
      # what /download offers. Without its own ticket, Gatekeeper has to reach Apple on first
      # open, and `stapler validate` below fails. `--wait` blocks until Apple answers; the
      # status is checked explicitly because notarytool exits 0 even for a rejected upload.
      - name: Notarise and staple the .dmg
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg=$(ls "$RUNNER_TEMP"/macos/*.dmg)
          auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          result=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 30m --output-format json)
          echo "$result"
          status=$(echo "$result" | jq -r .status)
          if [ "$status" != "Accepted" ]; then
            id=$(echo "$result" | jq -r .id)
            echo "::error::Notarisation of the .dmg returned '$status'"
            xcrun notarytool log "$id" "${auth[@]}" || true
            exit 1
          fi
          xcrun stapler staple "$dmg"

      # On a tag, prove the notarisation ticket is really stapled to what users download.
      - name: Verify the notarisation
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: xcrun stapler validate "$RUNNER_TEMP"/macos/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: hopshot-macos
          path: ${{ runner.temp }}/macos/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: hopshot-windows
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: hopshot-macos
          path: dist/macos

      - name: Checksum
        working-directory: dist
        run: |
          for file in windows/*-setup.exe macos/*.dmg; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")" | tee "$(basename "$file").sha256")
          done

      # What tauri-plugin-updater fetches (ARCHITECTURE §9). Runs on a rehearsal too, so a
      # broken manifest shows up before a tag does.
      - name: Build the update manifest
        working-directory: dist
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-rehearsal' }}
          DOWNLOAD_BASE: ${{ vars.DOWNLOAD_BASE || 'https://downloads.hopshot.xyz' }}
          WINDOWS_DIR: windows
          MACOS_DIR: macos
        run: node "$GITHUB_WORKSPACE/scripts/update-manifest.mjs"

      # The actual distribution channel (ARCHITECTURE §9). GitHub Releases cannot serve this
      # repo's assets: it is private, and private release downloads 404 without a token, which
      # an installed app never has. R2 behind downloads.hopshot.xyz is public, keeps the repo
      # and its business docs private, and gives us download counts GitHub would not.
      #
      # A bucket of its own, never hopshot-blobs: that one holds users' encrypted drops and
      # must stay private.
      - name: Publish to R2
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          put() {
            npx --yes wrangler@4 r2 object put "hopshot-downloads/$1" \
              --file="$2" --content-type="$3" --cache-control="$4" --remote
          }
          immutable="public, max-age=31536000, immutable"

          # Version-qualified, so a URL handed out in a manifest never changes underneath an
          # install that is mid-download. Every file goes up before latest.json, so no install
          # is ever pointed at a file that is not there yet.
          for file in windows/*-setup.exe macos/*.dmg macos/*.app.tar.gz; do
            name=$(basename "$file")
            put "$TAG/$name" "$file" "application/octet-stream" "$immutable"
          done
          for file in windows/*.sha256 macos/*.sha256; do
            put "$TAG/$(basename "$file")" "$file" "text/plain" "$immutable"
          done

          # The one mutable key: every install polls exactly this URL forever. Short cache so
          # a release is noticed within minutes rather than hours.
          put "latest.json" "latest.json" "application/json" "public, max-age=300"

      # Published as a **draft**, so a build is installed once from the release itself before
      # it is public. The Windows installer is unsigned and SmartScreen will warn; the Mac app
      # is notarised and opens normally. `gh` ships on the runner, so no third-party action
      # gets `contents: write` and the release binaries.
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > notes.md <<'NOTES'
          Hopshot for Windows 10/11 (64-bit) and macOS 13 or newer (Apple Silicon and Intel).

          **Windows:** the installer is **unsigned**, so SmartScreen will warn the first time:
          **More info -> Run anyway**.

          **macOS:** open the .dmg and drag Hopshot to Applications. On the first capture,
          macOS asks for Screen Recording permission.

          Verify any download against its `.sha256` if you would rather check it yourself.

          Free to download. Capture is locked until you buy - $19 once, everything included.
          14-day refund, no questions asked.
          NOTES

          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "Hopshot ${{ github.ref_name }}" \
            --notes-file notes.md \
            windows/*-setup.exe windows/*.sha256 \
            macos/*.dmg macos/*.app.tar.gz macos/*.sha256 \
            latest.json
