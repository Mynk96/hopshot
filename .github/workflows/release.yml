name: Release

# Windows only, which is the launch scope (PRD §9). A macOS leg goes here when there is a Mac
# to build and notarise on; adding an untested one now would publish a binary nobody has run.
on:
  push:
    tags: ["v*"]
  # So the whole thing can be rehearsed without creating a tag. A dispatch run uploads
  # nothing — it only proves the build works.
  workflow_dispatch:

permissions:
  contents: write # creating the release and uploading the installer

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never kill a half-uploaded release

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: release-x86_64-pc-windows-msvc

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Before anything is built: the download page builds its URL from tauri.conf.json, so a
      # tag that disagrees with it would publish an installer nobody can reach.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-version.mjs "${{ github.ref_name }}"

      - name: Check every copy of the version agrees
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: node scripts/check-version.mjs

      # The gate. A release build is slow, and shipping a binary whose tests were never run is
      # how a broken installer reaches the one page that has to work.
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

      # `--bundles nsis` rather than tauri.conf.json's "all": the MSI is not what the download
      # page offers, and the Store build is packaged separately as MSIX (ARCHITECTURE §9).
      #
      # The signing key is what makes self-updates safe: every install verifies the download
      # against the public half compiled into it, so an unsigned or tampered payload is
      # refused. Without these the build still succeeds but emits no .sig, and the update
      # manifest below would be useless.
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm -F desktop tauri build --bundles nsis

      # What tauri-plugin-updater fetches (ARCHITECTURE §9). Written by hand rather than
      # pulling in tauri-action: it is a few lines, and the reasoning that keeps `gh` as the
      # only thing holding `contents: write` applies to the build step too.
      #
      # Node rather than jq because setup-node above guarantees it on every runner, and it
      # can be run locally to check this logic without pushing a tag.
      - name: Build the update manifest
        shell: bash
        working-directory: apps/desktop/src-tauri/target/release/bundle/nsis
        env:
          TAG: ${{ github.ref_name }}
          DOWNLOAD_BASE: ${{ vars.DOWNLOAD_BASE || 'https://downloads.hopshot.xyz' }}
        run: node "$GITHUB_WORKSPACE/scripts/update-manifest.mjs"

      - name: Checksum
        shell: bash
        working-directory: apps/desktop/src-tauri/target/release/bundle/nsis
        run: |
          for file in *-setup.exe; do
            sha256sum "$file" | tee "$file.sha256"
          done

      # The actual distribution channel (ARCHITECTURE §9). GitHub Releases cannot serve this
      # repo's assets: it is private, and private release downloads 404 without a token, which
      # an installed app never has. R2 behind downloads.hopshot.xyz is public, keeps the repo
      # and its business docs private, and gives us download counts GitHub would not.
      #
      # A bucket of its own, never hopshot-blobs: that one holds users' encrypted drops and
      # must stay private.
      - name: Publish to R2
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: apps/desktop/src-tauri/target/release/bundle/nsis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          put() {
            npx --yes wrangler@4 r2 object put "hopshot-downloads/$1"               --file="$2" --content-type="$3" --cache-control="$4" --remote
          }

          installer=$(ls *-setup.exe)

          # Version-qualified, so a URL handed out in a manifest never changes underneath an
          # install that is mid-download.
          put "$TAG/$installer"         "$installer"         "application/octet-stream" "public, max-age=31536000, immutable"
          put "$TAG/$installer.sha256"  "$installer.sha256"  "text/plain"               "public, max-age=31536000, immutable"

          # The one mutable key: every install polls exactly this URL forever. Short cache so
          # a release is noticed within minutes rather than hours.
          put "latest.json" "latest.json" "application/json" "public, max-age=300"

      - uses: actions/upload-artifact@v4
        with:
          name: hopshot-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

      # Published as a **draft**. The binary is unsigned, so SmartScreen will warn about it —
      # the one thing worth doing before it is public is installing it once from the release
      # itself and clicking through that warning, exactly as a buyer will. Publishing is then
      # one click in the GitHub UI, and the download page starts working the moment it lands.
      # `gh` ships on the runner, so no third-party action gets `contents: write` and the
      # release binary. The notes are written here rather than generated, because "SmartScreen
      # will warn you" is the single most useful sentence on this page.
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/desktop/src-tauri/target/release/bundle/nsis
        run: |
          set -euo pipefail

          cat > notes.md <<'NOTES'
          Hopshot for Windows 10/11, 64-bit.

          The installer is **unsigned**, so Windows SmartScreen will warn the first time:
          **More info -> Run anyway**. Verify the download against its `.sha256` if you would
          rather check it yourself.

          Free to download. Capture is locked until you buy - $12 once, or $19 with Sync.
          14-day refund, no questions asked.
          NOTES

          # --draft so an unsigned binary is never public until it has been installed once
          # from the release itself. Publishing is then one click, and the download page
          # starts resolving the moment it lands.
          # The same .exe serves both audiences: a new visitor downloads it from the website,
          # and an existing install downloads it again through latest.json, which carries its
          # signature. They ship together because a manifest pointing outside its own release
          # is a dead update.
          gh release create "${{ github.ref_name }}"             --draft             --title "Hopshot ${{ github.ref_name }}"             --notes-file notes.md             *-setup.exe *-setup.exe.sha256 latest.json
